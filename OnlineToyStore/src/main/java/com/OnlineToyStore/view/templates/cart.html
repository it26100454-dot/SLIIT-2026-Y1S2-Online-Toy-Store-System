<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your cart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #fff8f0; color: #1c1917; }
        .btn { background: #ea580c; color: #fff; padding: 8px 14px; border-radius: 4px; text-decoration: none; border: 0; cursor: pointer; font: inherit; display: inline-block; }
        .btn.small { padding: 5px 10px; font-size: 13px; }

        .cart-page { max-width: 1040px; margin: 0 auto; }
        .cart-page h1 { margin: 8px 0 20px; }
        .back { color: #9a3412; text-decoration: none; font-size: 14px; }
        .back:hover, .back:focus-visible { text-decoration: underline; }

        .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
        .items, .summary { background: #fff; border: 1px solid #f1d9c4; border-radius: 8px; padding: 16px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #f6e6d6; vertical-align: middle; }
        th { font-size: 13px; color: #7c5a43; font-weight: 600; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }

        .qty { display: flex; gap: 6px; align-items: center; }
        .qty input { width: 64px; }
        input[type=number] { padding: 6px 8px; border: 1px solid #e3c9b0; border-radius: 4px; font: inherit; }
        input[type=number]:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #ea580c; outline-offset: 2px; }

        .link-danger { background: none; border: 0; color: #b91c1c; cursor: pointer; font: inherit; padding: 0; }
        .link-danger:hover { text-decoration: underline; }

        .summary h2 { margin: 0 0 12px; font-size: 18px; }
        .summary dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0 0 16px; }
        .summary dt { color: #7c5a43; }
        .summary dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
        .summary .discount { color: #15803d; }
        .summary .total { font-weight: 700; font-size: 18px; padding-top: 8px; border-top: 1px solid #f1d9c4; color: #1c1917; }

        .discount-form { margin-bottom: 16px; }
        .discount-form label { display: block; font-size: 14px; margin-bottom: 6px; }
        .discount-form .row { display: flex; gap: 8px; }
        .discount-form input { flex: 1; min-width: 0; }

        @media (max-width: 760px) {
            .cart-layout { grid-template-columns: 1fr; }
            .items { overflow-x: auto; }
        }
    </style>
</head>
<body>
<main class="cart-page">
    <a class="back" href="/toys">Keep shopping</a>
    <h1>Your cart</h1>

    <div class="cart-layout">

        <!-- Items -->
        <section class="items">
            <table>
                <thead>
                <tr>
                    <th>Toy</th>
                    <th class="num">Price</th>
                    <th>Quantity</th>
                    <th class="num">Total</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td></td>
                    <td class="num"></td>
                    <td>
                        <form class="qty" method="post" action="/cart/items/T001/update">
                            <input type="number" name="quantity" min="1" value="2" aria-label="Quantity">
                            <button type="submit" class="btn small">Update</button>
                        </form>
                    </td>
                    <td class="num"></td>
                    <td>
                        <form method="post" action="/cart/items/T001/delete">
                            <button type="submit" class="link-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td class="num"></td>
                    <td>
                        <form class="qty" method="post" action="/cart/items/T002/update">
                            <input type="number" name="quantity" min="1" value="1" aria-label="Quantity">
                            <button type="submit" class="btn small">Update</button>
                        </form>
                    </td>
                    <td class="num"></td>
                    <td>
                        <form method="post" action="/cart/items/T002/delete">
                            <button type="submit" class="link-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <aside class="summary">
            <h2>Order summary</h2>
            <dl>
                <dt>Toys in cart</dt>
                <dd></dd>
                <dt>Subtotal</dt>
                <dd></dd>
                <dt></dt>
                <dd class="discount"></dd>
                <dt class="total"></dt>
                <dd class="total"></dd>
            </dl>

            <form method="post" action="/cart/discount" class="discount-form">
                <label for="pct">Discount percentage</label>
                <div class="row">
                    <input id="pct" type="number" name="discountPercentage" step="0.01" min="0" max="100" value="10">
                    <button type="submit" class="btn">Apply</button>
                </div>
            </form>

            <form method="post" action="/cart/clear">
                <button type="submit" class="link-danger">Clear cart</button>
            </form>
        </aside>
    </div>


</main>
</body>
</html>
